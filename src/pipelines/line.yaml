# HTRflow demo pipeline
# Single YOLO model outputs both text regions + text lines (flat),
# then we nest lines into regions before text recognition.

steps:

- step: Segmentation
  settings:
    model: yolo
    model_settings:
      model: /home/dgxuser/erik/projects/ultralytics/models/yolo26x_all_gbg_lines_260603/train/weights/best.pt
    generation_settings:
      batch_size: 2

#- step: NestRegionsAndLines
#  settings:
#    region_labels: ["textregion"]
#    line_labels: ["textline"]
#    only_if_flat: true
#    min_line_overlap: 0.9
#    tie_break: "smallest_region"

- step: TextRecognition
  settings:
    model: WordLevelTrocr
    model_settings:
      model: Riksarkivet/trocr-large-handwritten-hist-swe-3-char
      model_kwargs:
        # WordLevelTrOCR needs decoder attentions to locate word boundaries.
        attn_implementation: eager
    generation_settings:
      batch_size: 4
      num_beams: 1
      interpolate_pos_encoding: true
      max_new_tokens: 160

- step: Export
  settings:
    dest: /home/dgxuser/erik/projects/QualityPrediction/data/eval_swedish_lion_26/htrflow_json/line_sl26
    format: json
